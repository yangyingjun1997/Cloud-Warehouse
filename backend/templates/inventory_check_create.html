{% extends "web_base.html" %}

{% block title %}新建盘点任务 - 售后仓库管理系统{% endblock %}
{% block crumb %}<a href="{% url 'inventory_check_list' %}">盘点任务</a> / 新建任务{% endblock %}

{% block content %}
<div class="page-heading"><div><h1>新建盘点任务</h1><p class="page-copy">创建时会保存仓库内单件资产和耗材配件的账面快照。</p></div><a class="button button-secondary" href="{% url 'inventory_check_list' %}">返回任务列表</a></div>
<section class="panel form-panel">
  <form method="post" class="stack-form">{% csrf_token %}
    <div class="form-field"><label for="check-name">任务名称 <span class="required-mark">*</span></label><input id="check-name" name="name" required maxlength="160" placeholder="例如：2026 年 8 月研发库存盘点"></div>
    <div class="form-grid form-grid-2">
      <div class="form-field"><label for="check-warehouse">盘点仓库 <span class="required-mark">*</span></label><select id="check-warehouse" name="warehouse_id" required><option value="">请选择仓库</option>{% for warehouse in warehouses %}<option value="{{ warehouse.id }}">{{ warehouse.name }}（{{ warehouse.code }}）</option>{% endfor %}</select></div>
      <div class="form-field"><label for="check-location">盘点库位 <span class="field-hint">可选</span></label><select id="check-location" name="location_id"><option value="">全仓库</option>{% for location in locations %}<option value="{{ location.id }}" data-warehouse="{{ location.warehouse_id }}">{{ location.warehouse.name }} / {{ location.code }} {{ location.name }}</option>{% endfor %}</select></div>
    </div>
    <div class="form-field"><label for="check-note">任务说明 <span class="field-hint">可选</span></label><textarea id="check-note" name="note" rows="4" placeholder="填写盘点负责人、现场范围或注意事项"></textarea></div>
    <div class="notice info">创建后会按当前账面生成明细。资产按单件核对，耗材配件按总数核对；盘点开始后才能录入结果。</div>
    <div class="form-actions"><button class="button button-primary" type="submit">创建并查看任务</button><a class="button button-secondary" href="{% url 'inventory_check_list' %}">取消</a></div>
  </form>
</section>
<script>
  (() => {
    const warehouse = document.getElementById('check-warehouse');
    const location = document.getElementById('check-location');
    if (!warehouse || !location) return;
    const update = () => {
      [...location.options].forEach(option => {
        option.hidden = Boolean(option.dataset.warehouse && option.dataset.warehouse !== warehouse.value);
      });
      if (location.selectedOptions[0]?.hidden) location.value = '';
    };
    warehouse.addEventListener('change', update);
    update();
  })();
</script>
{% endblock %}
