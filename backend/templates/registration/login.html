<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>登录 - 售后仓库管理系统</title>
  <style>:root { --ink: #1c2d34; --muted: #6e8086; --line: #d9e3e4; --teal: #18736e; --canvas: #eef3f3; } * { box-sizing: border-box; } body { display: grid; min-height: 100vh; margin: 0; place-items: center; color: var(--ink); background: var(--canvas); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; } main { width: min(100% - 32px, 390px); padding: 34px; background: #fff; border: 1px solid var(--line); border-radius: 8px; } .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; } .mark { display: grid; width: 34px; height: 34px; place-items: center; color: #fff; background: var(--teal); border-radius: 7px; font-size: 12px; font-weight: 700; } h1 { margin: 0; font-size: 21px; } p { margin: 7px 0 0; color: var(--muted); font-size: 12px; } form { display: grid; gap: 16px; margin-top: 25px; } label { display: grid; gap: 7px; color: #4b6167; font-size: 12px; } input { width: 100%; padding: 10px 11px; color: var(--ink); border: 1px solid var(--line); border-radius: 5px; outline-color: var(--teal); } button { min-height: 38px; color: #fff; background: var(--teal); border: 0; border-radius: 5px; cursor: pointer; font-weight: 650; } .error { padding: 9px 10px; color: #a34438; background: #ffebe7; border-radius: 5px; font-size: 12px; } .foot { margin-top: 20px; color: var(--muted); font-size: 11px; text-align: center; }</style>
</head>
<body><main><div class="brand"><span class="mark">仓</span><div><h1>售后仓库管理系统</h1><p>请使用已分配的账号登录</p></div></div>{% if form.errors %}<div class="error">用户名或密码不正确，请重新输入。</div>{% endif %}<form method="post">{% csrf_token %}<label>用户名<input type="text" name="username" autocomplete="username" autofocus required></label><label>密码<input type="password" name="password" autocomplete="current-password" required></label>{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<button type="submit">登录</button></form><div class="foot">账号由系统管理员创建和分配</div></main></body>
</html>
