{% extends "web_base.html" %}
{% block title %}修改密码 - 售后仓库管理系统{% endblock %}
{% block crumb %}修改密码{% endblock %}
{% block content %}<div class="lookup-card"><h1>修改密码</h1><p class="page-copy">请使用不易猜测的密码，并妥善保管。</p><form method="post" style="display:grid; gap:14px; margin-top:22px">{% csrf_token %}{% for field in form %}<label style="display:grid; gap:7px; color:var(--muted); font-size:12px">{{ field.label }}{{ field }}{% for error in field.errors %}<span style="color:var(--coral)">{{ error }}</span>{% endfor %}</label>{% endfor %}<button class="button button-primary" type="submit" style="width:fit-content">确认修改</button></form></div>{% endblock %}
