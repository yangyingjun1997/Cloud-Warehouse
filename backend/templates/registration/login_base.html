<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}售后仓库管理系统{% endblock %}</title>
  {# 登录页也支持添加到主屏幕：iOS 不读 manifest 的 icons，必须显式给 apple-touch-icon。 #}
  <link rel="apple-touch-icon" sizes="180x180" href="/static/warehouse/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="售后仓库">
  <meta name="theme-color" content="#173239">
  <style>:root { --ink: #1c2d34; --muted: #6e8086; --line: #d9e3e4; --teal: #18736e; --canvas: #eef3f3; } * { box-sizing: border-box; } body { display: grid; min-height: 100vh; margin: 0; place-items: center; color: var(--ink); background: var(--canvas); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; } main { width: min(100% - 32px, 390px); padding: 34px; background: #fff; border: 1px solid var(--line); border-radius: 8px; } .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; } .mark { display: grid; width: 34px; height: 34px; place-items: center; color: #fff; background: var(--teal); border-radius: 7px; font-size: 12px; font-weight: 700; } h1 { margin: 0; font-size: 21px; } p { margin: 7px 0 0; color: var(--muted); font-size: 12px; } form { display: grid; gap: 16px; margin-top: 25px; } label { display: grid; gap: 7px; color: #4b6167; font-size: 12px; } input, textarea, select { width: 100%; padding: 10px 11px; color: var(--ink); border: 1px solid var(--line); border-radius: 5px; outline-color: var(--teal); font: inherit; } button { min-height: 38px; color: #fff; background: var(--teal); border: 0; border-radius: 5px; cursor: pointer; font-weight: 650; } .error { padding: 9px 10px; color: #a34438; background: #ffebe7; border-radius: 5px; font-size: 12px; } .notice { padding: 9px 10px; margin-bottom: 12px; border-radius: 5px; font-size: 12px; background: #eef7f6; color: #14625e; } .notice.error { background: #ffebe7; color: #a34438; } .notice.success { background: #eaf6ec; color: #24693a; } .required { color: #a34438; } .field-error { color: #a34438; font-size: 11px; } .foot { margin-top: 20px; color: var(--muted); font-size: 11px; text-align: center; } .foot a { color: var(--teal); text-decoration: none; } .login-links { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 11px; } .login-links a { color: var(--teal); text-decoration: none; } .login-links a:hover { text-decoration: underline; }</style>
</head>
<body>{% block body %}{% endblock %}</body>
</html>
