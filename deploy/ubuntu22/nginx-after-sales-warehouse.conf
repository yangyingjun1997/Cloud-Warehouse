server {
    # default_server：站点是这台机器上唯一的 Web 服务，显式声明后
    # 未匹配其它 server_name 的请求（含 __PUBLIC_DOMAIN__）都落到这里。
    # 不声明时会隐式抢第一个 server 块，一旦将来新增站点，
    # 域名请求可能被路由到错误的 server 块。
    listen 80 default_server;
    listen [::]:80 default_server;
    # Keep local health checks on the same virtual host as LAN requests.
    # __PUBLIC_DOMAIN__ 由 install.sh 注入对外域名；它必须显式列出，
    # 否则经 Cloudflare 隧道进来的请求只能靠 default_server 兜底。
    server_name __SERVER_NAME__ __PUBLIC_DOMAIN__ 127.0.0.1 localhost;

    # 与后端 upload_validation.MAX_ATTACHMENT_SIZE 保持一致（100 MB）。
    # 改后端上限却不改这里，请求会在反代层被 413 拦掉，用户看不到真实原因。
    client_max_body_size 100m;
    access_log /var/log/nginx/after-sales-warehouse.access.log;
    error_log /var/log/nginx/after-sales-warehouse.error.log warn;

    # 内网也值得开 gzip：基础模板约 100 KB、zxing 库约 390 KB，
    # 压缩后通常只剩 1/3，直接改善每页首屏。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml;

    location /static/ {
        alias /opt/after-sales-warehouse/current/static/;
        access_log off;
        expires 7d;
    }

    # 生命周期附件必须通过 Django 权限校验下载，禁止绕过应用直读文件。
    location ~ ^/media/assets/[^/]+/archive/ {
        return 404;
    }

    location /media/ {
        alias /srv/after-sales-warehouse/media/;
        expires 1d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 100 MB 附件在慢速内网/公网隧道下可能需要几分钟。
    # 默认 90s 读超时会让大文件上传中途断开，这里放宽到 10 分钟。
    client_body_timeout 600s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    }
}
