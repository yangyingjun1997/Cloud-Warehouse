server {
    listen 80;
    listen [::]:80;
    # Keep local health checks on the same virtual host as LAN requests.
    server_name __SERVER_NAME__ 127.0.0.1 localhost;

    client_max_body_size 20m;
    access_log /var/log/nginx/after-sales-warehouse.access.log;
    error_log /var/log/nginx/after-sales-warehouse.error.log warn;

    # 内网也值得开 gzip：基础模板约 100 KB、zxing 库约 390 KB，
    # 压缩后通常只剩 1/3，直接改善每页首屏。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml;

    location /static/ {
        alias /opt/after-sales-warehouse/current/static/;
        access_log off;
        expires 7d;
    }

    # 生命周期附件必须通过 Django 权限校验下载，禁止绕过应用直读文件。
    location ~ ^/media/assets/[^/]+/archive/ {
        return 404;
    }

    location /media/ {
        alias /srv/after-sales-warehouse/media/;
        expires 1d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
