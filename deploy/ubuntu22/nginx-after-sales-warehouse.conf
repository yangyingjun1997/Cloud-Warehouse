server {
    listen 80;
    listen [::]:80;
    # Keep local health checks on the same virtual host as LAN requests.
    server_name __SERVER_NAME__ 127.0.0.1 localhost;

    client_max_body_size 20m;
    access_log /var/log/nginx/after-sales-warehouse.access.log;
    error_log /var/log/nginx/after-sales-warehouse.error.log warn;

    location /static/ {
        alias /srv/after-sales-warehouse/static/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /srv/after-sales-warehouse/media/;
        expires 1d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
